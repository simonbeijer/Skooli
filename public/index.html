<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Grej of the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="sk-header">
    <div class="sk-header__inner">
      <a class="sk-header__brand" href="{{SKOOLI_URL}}/dashboard">
        <span class="sk-header__logo">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
        </span>
        <span class="sk-header__name">Skooli</span>
      </a>
      <div class="sk-header__actions">
        <a class="sk-header__link" href="{{SKOOLI_URL}}/dashboard">← Tillbaka till Skooli</a>
      </div>
    </div>
  </header>

  <div class="tool-bar">
    <h1 class="tool-title"><span class="logo"></span>Grej of the Day</h1>
    <nav id="steps" aria-label="Steg">
      <button data-step="1"><span class="num">1</span>Ämne</button>
      <button data-step="2"><span class="num">2</span>Granska text</button>
      <button data-step="3"><span class="num">3</span>Välj bilder</button>
      <button data-step="4"><span class="num">4</span>Ladda ner</button>
    </nav>
  </div>

  <main>
    <!-- Steg 1 -->
    <section id="step-1" class="step">
      <div class="card narrow">
        <h2>Vad är veckans grej?</h2>
        <div class="field">
          <span class="field-label">Färg på presentationen</span>
          <div id="colors"></div>
        </div>
        <label class="field">Ämne
          <input id="topic" placeholder="t.ex. regnskogen, bläckfisken, Eiffeltornet" />
        </label>
        <label class="field">Önskemål <span class="optional">(valfritt)</span>
          <textarea id="notes" rows="3" placeholder="t.ex. fokusera på djuren och varför de är viktiga"></textarea>
        </label>
        <div class="actions">
          <button id="generate" class="primary">Ta fram innehåll</button>
          <button id="cancel-generate" class="secondary" hidden>Avbryt</button>
        </div>
        <div id="progress" hidden>
          <div class="spinner"></div>
          <ul id="log"></ul>
        </div>
        <p id="gen-error" class="error" hidden></p>
      </div>
    </section>

    <!-- Steg 2 -->
    <section id="step-2" class="step" hidden>
      <div class="toolbar">
        <div><strong id="approve-count"></strong></div>
        <div class="hint">Klicka <b>Ta med</b> på det du vill ha i presentationen. Det du inte väljer kommer inte med.</div>
      </div>
      <div id="review"></div>
      <div class="next"><button class="primary" data-goto="3">Vidare till bilder<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
    </section>

    <!-- Steg 3 -->
    <section id="step-3" class="step" hidden>
      <div class="toolbar">
        <div id="source-status" class="hint"></div>
      </div>
      <div id="slots"></div>
      <div class="next"><button class="primary" data-goto="4">Vidare till nedladdning<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg></button></div>
    </section>

    <!-- Steg 4 -->
    <section id="step-4" class="step" hidden>
      <div class="card narrow">
        <h2>Ladda ner presentationen</h2>
        <div id="checklist"></div>
        <div class="actions">
          <button id="export" class="primary">Ladda ner .pptx</button>
        </div>
        <p class="hint">Öppna filen med Google Presentationer. Där kan du ändra allt.</p>
        <p id="export-error" class="error" hidden></p>
        <hr />
        <button id="reset" class="danger">Börja om med en ny grej</button>
      </div>
    </section>
  </main>

  <dialog id="img-dialog">
    <img id="img-dialog-img" alt="" />
    <p id="img-dialog-meta"></p>
    <form method="dialog"><button>Stäng</button></form>
  </dialog>

  <script src="app.js" type="module"></script>
</body>
</html>
